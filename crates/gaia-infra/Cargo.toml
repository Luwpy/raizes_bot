[package]
name = "gaia-infra"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
sqlx = {version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres"]}
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
tokio = {version = "1", features = ["macros", "rt-multi-thread"] }